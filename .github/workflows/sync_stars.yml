name: Auto Sync GitHub Stars

on:
  schedule:
    - cron: "0 2 * * *" 
  workflow_dispatch: 

jobs:
  sync-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_GITHUB_TOKEN }} # 👉 新增：用你的专属 Token 获取权限

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Python script
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: python ./scripts/sync_stars.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ./docs/auto_stars.md
          git commit -m "Auto update stars" || echo "No changes to commit"
          git push
