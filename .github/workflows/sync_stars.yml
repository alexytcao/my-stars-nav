name: Auto Sync GitHub Stars

on:
  schedule:
    - cron: "0 2 * * *" # 每天 UTC 2:00（北京时间上午 10:00）自动运行
  workflow_dispatch: # 允许你在 GitHub 网页上手动点击运行测试

jobs:
  sync-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须赋予写入仓库的权限
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Python script
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: python ./scripts/sync_stars.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ./docs/auto_stars.md
          git commit -m "Auto update stars [skip ci]" || echo "No changes to commit"
          git push
